name: Windows build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ScamBaitDesk.sln
      - run: dotnet build ScamBaitDesk.sln -c Release -p:Platform=x64 --no-restore
